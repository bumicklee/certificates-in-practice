# Mosquitto for cert-lab demo 13-2: mTLS only, no plain listener.
# Mounted into the container by run_broker.sh (paths are container paths).
# The host side of the port mapping is bound to the PC's LAN IP only (see run_broker.sh).

listener 8883
protocol mqtt

cafile   /pki/ca-chain.pem
certfile /pki/server/server-chain.crt
keyfile  /pki/server/server.key

tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

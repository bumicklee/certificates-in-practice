# 수업 6-1: mTLS 종료 지점. 클라이언트 인증서를 검증하고, 백엔드에는 "검증된" 인증서만 헤더로 넘긴다.
log_format mtls '$remote_addr "$request" $status verify=$ssl_client_verify s_dn="$ssl_client_s_dn"';

server {
    listen 8443 ssl;
    server_name shop.lab.example localhost;
    ssl_certificate     /pca/chain.pem;      # 서버 리프 + 중간 (private-ca)
    ssl_certificate_key /pca/leaf.key;
    ssl_protocols TLSv1.3;

    ssl_verify_client on;                    # 인증서 없으면 거절
    ssl_client_certificate /pca/root.crt;    # 클라이언트 인증서를 믿을 루트(사내 CA만)
    ssl_verify_depth 2;                      # 리프 → 중간 → 루트
    access_log /var/log/nginx/access.log mtls;

    location / {
        # 클라이언트가 보낸 같은 이름의 헤더는 여기서 덮어쓴다
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_pass http://10.31.0.21:8080;   # backend-safe (TRUSTED_PROXY=10.31.0.10)
    }
}

# 수업 6-2·6-3: 일부러 잘못 만든 프록시. 클라이언트 인증서를 요구하지 않고, 헤더도 손대지 않고 넘긴다.
server {
    listen 8444 ssl;
    server_name shop.lab.example localhost;
    ssl_certificate     /pca/chain.pem;
    ssl_certificate_key /pca/leaf.key;
    ssl_verify_client optional_no_ca;        # "검증은 백엔드가 하겠지"
    access_log /var/log/nginx/access.log mtls;
    location / {
        proxy_pass http://10.31.0.20:8080;   # backend-vuln (TRUSTED_PROXY 없음)
    }
}

# 수업 6-2·6-3: 무중단 교체. 믿는 루트 묶음(/rot/trust.pem)을 바꾸고 reload 한다.
server {
    listen 8445 ssl;
    server_name shop.lab.example localhost;
    ssl_certificate     /pca/chain.pem;
    ssl_certificate_key /pca/leaf.key;
    ssl_verify_client on;
    ssl_client_certificate /rot/trust.pem;
    ssl_verify_depth 2;
    access_log /var/log/nginx/access.log mtls;
    location / { default_type text/plain; return 200 "ok issuer=$ssl_client_i_dn\n"; }
}

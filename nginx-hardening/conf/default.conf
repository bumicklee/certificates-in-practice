# 16편 · 10·32편 공용: 127.0.0.1 전용 하드닝 예제
# Mozilla SSL Configuration Generator "intermediate" (guidelines 6.0) 를 바탕으로 했다.
# https://ssl-config.mozilla.org/  (nginx 1.30.6, OpenSSL 3.5)

# 1) HTTP(평문) → HTTPS 로 같은 호스트에 301. 실습은 포트가 18450이라 포트를 붙인다.
#    실서비스라면: return 301 https://$host$request_uri;
server {
    listen 80;
    server_name localhost shop.lab.example;
    server_tokens off;
    return 301 https://$host:18450$request_uri;
}

# 2) HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name localhost shop.lab.example;
    server_tokens off;

    # 공용 사설 CA(lab/private-ca/out)의 리프 + 중간. 읽기 전용으로 붙인다.
    ssl_certificate     /etc/nginx/certs/chain.pem;
    ssl_certificate_key /etc/nginx/certs/leaf.key;

    # TLS 1.2 / 1.3 만
    ssl_protocols TLSv1.2 TLSv1.3;
    # 키 교환 그룹: 하이브리드 양자 내성(3편) 먼저
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    # TLS 1.2 용 스위트: ECDHE + AEAD 만 (TLS 1.3 스위트는 OpenSSL 기본값이 이미 안전하다)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    # OCSP 스테이플링: 사설 CA에 OCSP 응답기가 없고, Let's Encrypt도 2025-08-06에 OCSP를 껐다(5·17편). 여기서는 끈다.

    # HSTS: 2년. preload 조건(1년 이상 + includeSubDomains + preload)을 맞춘 예.
    # 주의: includeSubDomains·preload 는 "모든 하위 도메인이 HTTPS"일 때만 켠다(16편).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        default_type text/plain;
        return 200 "hello from pki-lab-nginx-hardening\n";
    }
}

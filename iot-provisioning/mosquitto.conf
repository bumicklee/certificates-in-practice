# 수업 9-1 로컬 브로커. 127.0.0.1에만 묶는다.  실행: mosquitto -c mosquitto.conf (이 폴더에서)
per_listener_settings false
persistence false
allow_anonymous false
log_dest file out/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type debug

listener 18480 127.0.0.1
cafile   out/ca/ca-chain.pem
certfile out/broker/chain.pem
keyfile  out/broker/broker.key
tls_version tlsv1.2
require_certificate true          # 인증서 없는 클라이언트는 TLS 단계에서 끊는다
use_identity_as_username true     # 인증서 CN이 MQTT 사용자 이름이 된다 (= 사물 이름)
acl_file acl

# 2단계: 발급받은 인증서로 TLS를 연다. 갱신 뒤 nginx -s reload 하면 새 인증서를 읽는다.
server {
    listen 443 ssl;
    server_name shop.lab.example;
    ssl_certificate     /data/lego/certificates/shop.lab.example.crt;
    ssl_certificate_key /data/lego/certificates/shop.lab.example.key;
    location / { return 200 "hello from shop.lab.example\n"; }
}

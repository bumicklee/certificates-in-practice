# ~/.aws/config 예 — 기기(또는 공장 서버)가 X.509 인증서로 임시 AWS 자격 증명을 받는다.  【직접 해 보기: AWS】
# 준비: 신뢰 앵커(Trust anchor)에 기기 인증서를 발급한 CA 등록 → 프로필(Profile) → 역할(Role, 신뢰 정책에 rolesanywhere.amazonaws.com)
# 도우미: aws_signing_helper (2026-08-24 기준 최신 1.8.5. 받은 파일의 SHA256을 공식 표와 대조)
[profile boiler-uploader]
credential_process = /usr/local/bin/aws_signing_helper credential-process --certificate /etc/boiler/device.crt --intermediates /etc/boiler/issuing.crt --private-key /etc/boiler/device.key --trust-anchor-arn arn:aws:rolesanywhere:ap-northeast-2:111122223333:trust-anchor/EXAMPLE-TA --profile-arn arn:aws:rolesanywhere:ap-northeast-2:111122223333:profile/EXAMPLE-PROFILE --role-arn arn:aws:iam::111122223333:role/boiler-log-uploader --session-duration 900
region = ap-northeast-2
# 키가 TPM·PKCS#11에 있으면 --private-key 'pkcs11:object=...' 또는 handle:0x81000001 형식을 쓴다
